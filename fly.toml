# Fly.io deployment for Jarvis.
# Create the app/volume first, then deploy:
#   fly launch --copy-config --name jarvis-danvdm --no-deploy
#   fly volumes create jarvis_data --size 20 --region iad
#   fly secrets set SETUP_PASSWORD=... OPENCLAW_GATEWAY_TOKEN=... TS_AUTHKEY=...
#   fly deploy

app = "openclaw-broken-fire-2366"
primary_region = "ewr"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    OPENCLAW_GIT_REF = "v2026.5.27"

[env]
  PORT = "8080"
  OPENCLAW_STATE_DIR = "/data/.openclaw"
  OPENCLAW_WORKSPACE_DIR = "/data/workspace"
  OPENCLAW_PLUGIN_STAGE_DIR = "/data/.clawdbot/plugin-runtime-deps"
  CODEX_LB_ENABLED = "1"
  CODEX_LB_DATA_DIR = "/data/.codex-lb"
  CODEX_LB_HOST = "127.0.0.1"
  CODEX_LB_PORT = "2455"
  OPENCLAW_PUBLIC_HOSTS = "jarvis.danvdm.com,jarvis.tail51d7a2.ts.net"

[[mounts]]
  source = "jarvis_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/setup/healthz"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
